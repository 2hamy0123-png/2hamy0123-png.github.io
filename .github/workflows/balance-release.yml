name: Balance release

# Publishes a public download, in either of two ways:
#   - Actions tab > Balance release > Run workflow, on main, with a version such as 0.1.0
#   - pushing a version tag such as v0.1.0
# The APK is attached to a GitHub Release as Balance.apk, so this permanent link always
# serves the newest version:
#   https://github.com/2hamy0123-png/2hamy0123-png.github.io/releases/latest/download/Balance.apk
#
# It refuses to run without the signing key, because an APK signed with a
# throwaway key could not be updated by the people who install it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on the main branch."
              exit 1
            fi
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The version must look like 1.2.3."
            exit 1
          fi
          if [ "${BASH_REMATCH[2]}" -gt 99 ] || [ "${BASH_REMATCH[3]}" -gt 99 ]; then
            echo "::error::Minor and patch numbers must be 99 or less."
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 10000 + BASH_REMATCH[3] * 100 ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Publishing Balance $VERSION (version code $CODE)"

      - name: Require the signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error::Add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD first (Settings, Secrets and variables, Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: balance/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test and build the web app
        working-directory: balance
        run: |
          export APP_VERSION="$VERSION"
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Build the signed APK
        working-directory: balance/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Use one password for the store and the key (they are the same in this PKCS12 keystore),
          # and ignore stray spaces or line breaks picked up when the secret was pasted.
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore fingerprint: $(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-12), password length: ${#KEYSTORE_PASSWORD}"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore in ANDROID_KEYSTORE_BASE64. Paste both values again from the secrets file."
            exit 1
          fi
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks" KEYSTORE_PASSWORD KEY_ALIAS=balance KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export APP_VERSION="$VERSION"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Balance.apk"

      - name: Verify the signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs Balance.apk
          sha256sum Balance.apk | tee Balance.apk.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat balance/release-notes.md; echo; echo "**SHA-256:** \`$(cut -d' ' -f1 Balance.apk.sha256)\`"; } > notes.md
          # Creates the tag on this commit when it does not exist yet (the Run workflow route).
          gh release create "$TAG" Balance.apk Balance.apk.sha256 \
            --title "Balance $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
