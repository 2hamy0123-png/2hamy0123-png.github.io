name: Balance Android build

# Builds an installable APK of the Balance app on GitHub's servers.
# Download it from the run's "Artifacts" section.

on:
  push:
    paths:
      - 'balance/**'
      - '.github/workflows/balance-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: balance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: balance/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: balance/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: balance-apk
          path: balance/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
